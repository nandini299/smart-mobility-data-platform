name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python and dbt checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting and dbt tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest sqlglot dbt-core dbt-athena

      - name: Lint Python
        run: ruff check .

      - name: Compile Python
        run: |
          python -m compileall -q streaming airflow/dags dashboard glue ai

      - name: SQL guardrail unit tests
        run: python -m pytest -q -p no:cacheprovider tests/dashboard

      - name: Prepare dbt profile
        working-directory: dbt_mobility
        run: cp profiles.example.yml profiles.yml

      - name: Install dbt packages
        working-directory: dbt_mobility
        run: dbt deps --profiles-dir .

      - name: Parse dbt project
        working-directory: dbt_mobility
        run: dbt parse --profiles-dir .

  glue-tests:
    name: Glue 4.0 unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android

      - name: Pull AWS Glue 4.0 Docker image
        run: |
          docker pull public.ecr.aws/glue/aws-glue-libs:glue_libs_4.0.0_image_01

      - name: Run Glue unit tests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/hadoop/workspace \
            -w /home/hadoop/workspace \
            --entrypoint python3 \
            public.ecr.aws/glue/aws-glue-libs:glue_libs_4.0.0_image_01 \
            -m pytest -q -p no:cacheprovider tests/glue
